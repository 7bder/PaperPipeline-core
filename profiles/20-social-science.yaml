    read: [{path: "{ms}/38-final.md", priority: must_read, hint: 终稿真源}, {path: "{ms}/37-references.md", priority: must_read, hint: 文献表}, {path: "{fig}/", priority: must_read, hint: 图件}, {path: "{latex}/templates/", priority: must_read, hint: 目标刊模板}]

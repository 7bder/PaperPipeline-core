    read: [{path: "{ms}/36-draft.md", priority: must_read, hint: 受审稿}, {path: "{ms}/37-references.md", priority: must_read, hint: 文献表}, {path: "{data}/11-analysis.md", priority: must_read, hint: 数据事实}, {path: "{review}/53-reporting-checklist.md", priority: must_read, hint: 报告规范清单结论（未满足项是否已处置）}, {path: "{fig}/", priority: reference, hint: 图件}, {path: "{admin}/03-journal-selection.md", priority: must_read, hint: 目标刊要求}]
    edit: ["{review}/50-review-report.md"]
    hours: 3
    difficulty: high
    verify: "python {verify_tool} task-presubmit-review"

  - id: task-finalize-manuscript
    module: mod-final
    stage: P6
    name: 按评审定稿
    brief: 按评审意见定稿，产出零占位符终稿与响应说明。
    ac:
      - "`{ms}/38-final.md` 落实评审报告中全部 CRITICAL/MAJOR 项，并在 `{review}/51-response-to-review.md` 逐条给处置与依据。"
      - "终稿零占位符：无标记、无 TODO/TBD、无面向作者的说明块。"
      - "定稿只改陈述与措辞，不改任何结果数值；数值变更须回到上游任务并说明。"
    read: [{path: "{review}/50-review-report.md", priority: must_read, hint: 评审问题清单}, {path: "{review}/53-reporting-checklist.md", priority: must_read, hint: 规范未满足项}, {path: "{ms}/36-draft.md", priority: must_read, hint: 待改稿}, {path: "{ms}/37-references.md", priority: must_read, hint: 文献表}, {path: "{lit}/22-refs.json", priority: reference, hint: 终局 strict 验真库（B06b 门判定对象）}]
